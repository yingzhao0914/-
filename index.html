<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>英招商铺</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
    margin: 0;
    font-family: Arial;
    background: #f5f5f5;
}

/* 顶部 */
.header {
    background: #ff4d4f;
    padding: 10px 20px;
    display: flex;
    align-items: center;
    color: white;
}

.logo {
    font-size: 20px;
    font-weight: bold;
}

.search {
    flex: 1;
    margin: 0 20px;
}

.search input {
    width: 100%;
    padding: 8px;
    border: none;
}

.user {
    cursor: pointer;
}

/* Banner */
.banner {
    background: url('https://picsum.photos/1200/300') no-repeat center;
    background-size: cover;
    height: 200px;
}

/* 分类 */
.categories {
    display: flex;
    overflow-x: auto;
    background: white;
    padding: 10px;
}

.categories div {
    margin-right: 15px;
    white-space: nowrap;
    cursor: pointer;
}

/* 商品 */
.products {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    gap: 10px;
    padding: 10px;
}

.card {
    background: white;
    padding: 10px;
    border-radius: 5px;
}

.card img {
    width: 100%;
}

.price {
    color: red;
    font-weight: bold;
}

/* 底部 */
.footer {
    text-align: center;
    padding: 20px;
    background: #222;
    color: white;
    margin-top: 20px;
}
</style>
</head>

<body>

<!-- 顶部 -->
<div class="header">
    <div class="logo">英招商铺</div>
    <div class="search">
        <input placeholder="搜索商品...">
    </div>
    <div class="user">搜索</div>
</div>

<!-- Banner -->
<div class="banner"></div>

<!-- 分类 -->
<div class="categories">
    <div>USDT靓号地址</div>
    <div>用户名</div>
    <div>999收藏</div>
    <div>星星</div>
    <div>会员</div>
</div>

<!-- 商品 -->
<div class="products">

    <div class="card">
        <img src="https://picsum.photos/200">
        <p>豹子号</p>
        <div class="price">￥39</div>
    </div>

    <div class="card">
        <img src="https://picsum.photos/201">
        <p>顺子号</p>
        <div class="price">￥99</div>
    </div>

    <div class="card">
        <img src="https://i.getgems.io/lAJejFrhLmslusL3l4Yy1mvsCwKLrKY2twnswFT9Krk/rs:fill:1000:0:1/g:ce/czM6Ly9nZXRnZW1zLW5mdC9uZnQvYy82OWFkMWU2MzdkODdkMTM1ZDE4OTVlNzQvMTAwMDAzMy9pbWFnZS5wbmc">
        <p>999装逼号</p>
        <div class="price">$ 20 </div>
    </div>

    <div class="card">
        <img src="https://picsum.photos/203">
        <p>星星</p>
        <div class="price">￥199</div>
    </div>

    <div class="card">
        <img src="https://picsum.photos/203">
        <p>会员</p>
        <div class="price">￥199</div>
    </div>
</div>

<!-- 底部 -->
<div class="footer">
    © 2026 我的商城
</div>

</body>
</html>
